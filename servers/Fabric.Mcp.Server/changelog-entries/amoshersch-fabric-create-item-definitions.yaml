changes:
  - section: "Features Added"
    description: "Added inline definitions, explicitly selected local definition files, existing folder IDs, item-specific creation payloads and definition options, and sensitivity label settings to Create Item, preserving HTTP creation and bounded operation waiting. Definition inputs use a reusable group without changing option names. Generic safety and request-contract checks run locally; Fabric validates item-specific layouts and content. Supplied label settings require a nonempty label ID."
