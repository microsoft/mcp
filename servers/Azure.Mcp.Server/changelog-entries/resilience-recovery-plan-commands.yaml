changes:
  - section: "Features Added"
    description: "Added the 'azmcp resilience recovery plan create' command to create or fully update a Zonal recovery plan with an explicitly selected system-assigned, user-assigned, or combined identity. Updates can switch identity types while preserving existing recovery groups."
  - section: "Features Added"
    description: "Added the 'azmcp resilience recovery plan delete' command to delete a recovery plan from an Azure service group. The command is idempotent and reports whether a plan was deleted."
  - section: "Features Added"
    description: "Added the 'azmcp resilience recovery plan resource update' command to include, exclude, configure, or remove recovery resources, including their recovery groups, associated identities, and protection settings. The command validates mandatory protection settings before first inclusion while preserving existing settings on sparse updates."
  - section: "Features Added"
    description: "Added the 'azmcp resilience recovery plan checkreadiness' command to discover and assess whether a recovery plan and its protected resources are ready for recovery operations. The command waits for the readiness job and returns its status, errors, failed tasks, and failed resources."
