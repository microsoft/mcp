changes:
  - section: "Features Added"
    description: "`azurebackup vault get` now accepts an optional `--expand` parameter (comma-separated: `security`, `mua`, `all`) to include extended vault posture fields (encryption state, cross-region restore state, MUA resource guard link). Default output shape is unchanged. Applies to both Recovery Services vaults (RSV) and Backup vaults (DPP)."