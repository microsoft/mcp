changes:
  - section: "Features Added"
    description: "`azurebackup vault get` now accepts an optional `--expand` parameter (comma-separated: `security`, `network`, `monitoring`, `mua`, `all`) to include extended vault posture fields (soft-delete/immutability/encryption state, public network access, cross-region/subscription restore, MUA resource guard). Default output shape is unchanged. Applies to both Recovery Services vaults (RSV) and Backup vaults (DPP)."