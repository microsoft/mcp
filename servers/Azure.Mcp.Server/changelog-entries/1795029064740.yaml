changes:
  - section: "Bugs Fixed"
    description: "Fixed tools that ignored or did not resolve '--tenant': 'applicationinsights recommendation list' now authenticates Profiler requests against the requested tenant, 'azuremigrate platformlandingzone request' now honors '--tenant' for the 'check', 'generate', and 'download' actions, and the 'appservice webapp diagnostic' and 'adme' commands now accept tenant display names in addition to tenant IDs."
