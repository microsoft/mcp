changes:
  - section: "Features Added"
    description: "MCP tools can now advertise an `outputSchema` and return `structuredContent` when enabled with `--structured-output-mode duplicated` or `--structured-output-mode compact`; the default `legacy` mode preserves content-only responses. In `all` mode, output schemas are generated from each opted-in command's source-generated `JsonTypeInfo`, with App Configuration as the first pilot. In `namespace` mode, selected in-process namespace tools use a stable tagged aggregate schema for command discovery, routed results, and guidance messages."
