changes:                                                         # Required
  - section: "Breaking Changes"                                     # Required - Valid sections: "New Features", "Breaking Changes", "Bug Fixes", "Other Changes"
    description: "Updated the MySQL `database query` tool to be destructive, non-idempotent, and non-read-only. The tool no longer rejects statements based on SQL verbs or keyword blocklists; the signed-in user's database permissions determine what a statement may do. Empty, oversized, commented, and stacked statements are still rejected."
