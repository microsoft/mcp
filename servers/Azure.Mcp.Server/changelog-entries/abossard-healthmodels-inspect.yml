changes:
  - section: "Features Added"
    description: |
      Added `azmcp monitor healthmodels inspect`, a read-only tool for the entities of an Azure Monitor Health Model:
      their health state, signals with values and both evaluation rules, what drives an entity's state (`--walk Causes`),
      what it depends on or what depends on it, health state history, signal history and data annotations, now or
      at a past instant (`--timestamp`).
  - section: "Other Changes"
    subsection: "Dependency Updates"
    description: |
      Updated `Azure.ResourceManager.CloudHealth` from 1.0.0-beta.3 to 1.0.0, `Azure.Core` from 1.61.0 to 1.64.0 and
      `System.ClientModel` from 1.15.0 to 1.16.0.
