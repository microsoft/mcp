changes:
  - section: "New Features"
    description: "Added `--sub-category`, `--tracking-ids` (repeatable, matching any supplied Service Health tracking ID), and `--retirement-date` filters to `azmcp advisor recommendation list`. Non-Security recommendations are enriched from matching Advisor metadata by `recommendationTypeId`; Security queries return recommendation-instance values directly. For enriched recommendations, metadata supplies `category`, `impact`, `subCategory`, and the display name used for both `shortDescription.problem` and `shortDescription.solution`."
