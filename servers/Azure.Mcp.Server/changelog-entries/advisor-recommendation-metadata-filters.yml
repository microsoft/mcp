changes:
  - section: "New Features"
    description: "Added `--sub-category`, multi-value `--tracking-ids`, and `--retirement-date` filters to `azmcp advisor recommendation list`. Pass multiple tracking IDs as space-separated values after one option. Tracking IDs and retirement date can be used independently or together. With either filter, `--sub-category` is optional; when specified, it must be `ServiceUpgradeAndRetirement`."
