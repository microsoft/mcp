changes:
  - section: "New Features"
    description: "Added `--sub-category`, `--tracking-ids` (repeatable, matches any of the supplied Service Health tracking IDs), and `--retirement-date` filters to `azmcp advisor recommendation list`. Returned recommendations are always joined with Advisor recommendation metadata by `recommendationTypeId`, so `category`, `impact`, `subCategory`, and `shortDescription.problem` come from `microsoft.advisor/metadata`. The metadata display name is returned as the short description; metadata does not provide a solution value."
