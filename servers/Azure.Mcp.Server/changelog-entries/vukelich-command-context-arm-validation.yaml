changes:
  - section: "Bugs Fixed"
    description: "Preserve original tool namespaces in command registrations, expose a single active command context per asynchronous flow, validate every shared ARM SDK request, including retries, paging, and sends without a command context, and disable automatic redirects for the server ARM transport."
  - section: "Breaking Changes"
    description: "Require HTTPS and reject private or reserved destination addresses on shared HTTP factory transports by default. Tools using shared clients, including Key Vault, App Configuration, and ACR, can no longer reach Private Link endpoints directly unless their namespace is temporarily allowed with the server start option --dangerously-disable-ssrf-protections-by-namespace or requests use a trusted outgoing proxy. Direct CLI commands have no namespace override context and remain protected. Preserve isolated protected, namespace-override, and system-proxy connection pools. Select one handler-wide explicit proxy in ALL_PROXY, HTTPS_PROXY, then HTTP_PROXY order; otherwise retain .NET HttpClient.DefaultProxy environment, operating-system, PAC, and bypass routing per destination. Retain handler-wide explicit and recording proxy exceptions, preserve default-proxy behavior on recording and explicitly unprotected clients, log proxy exceptions at debug level, and register shared HTTP defaults once per service collection."
  - section: "Bugs Fixed"
    description: "Use immutable per-host SSRF policies shared by injected endpoint validators, Azure service validation, HTTP transports, and namespace override startup telemetry. Inject validators through IEndpointValidator and resolve the executing namespace from the host's command context on every validation call instead of accepting caller-supplied namespaces. Azure service endpoint validation uses its own configured cloud rather than accepting a caller-supplied cloud. Capture the recording-proxy fallback per provider so normal parallel tests can exercise independent configurations without process-global resets."
