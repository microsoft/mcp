changes:
  - section: "Bugs Fixed"
    description: "Preserve original tool namespaces in command registrations, expose a single active command context per asynchronous flow, validate every shared ARM SDK request, including retries, paging, and sends without a command context, and disable automatic redirects for all factory-created HTTP clients."
  - section: "Breaking Changes"
    description: "Require HTTPS and reject outgoing requests to private or reserved destination addresses by default. Tools including Key Vault, App Configuration, and ACR can no longer reach Private Link endpoints directly unless their namespace is temporarily allowed with the server start option --dangerously-disable-ssrf-protections-by-namespace or requests use a trusted outgoing proxy. Direct CLI commands have no namespace override context and remain protected. Select one explicit proxy in ALL_PROXY, HTTPS_PROXY, then HTTP_PROXY order for both HTTP and HTTPS requests; NO_PROXY changes whether a request uses that proxy but does not restore transport IP address filtering. Otherwise, retain .NET HttpClient.DefaultProxy environment, operating-system, PAC, and bypass routing per destination, with filtering enabled whenever those rules select no proxy. Preserve isolated connection pools and default-proxy behavior, log proxy exceptions at debug level, and register HTTP defaults once per service collection."
  - section: "Bugs Fixed"
    description: "Use immutable per-host SSRF policies shared by injected endpoint validators, Azure service validation, HTTP transports, and namespace override startup telemetry. Inject validators through IEndpointValidator and resolve the executing namespace from the host's command context on every validation call instead of accepting caller-supplied namespaces. Azure service endpoint validation uses its own configured cloud rather than accepting a caller-supplied cloud. Capture the recording-proxy fallback per provider so normal parallel tests can exercise independent configurations without process-global resets."
