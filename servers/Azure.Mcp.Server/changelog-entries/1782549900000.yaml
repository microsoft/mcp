changes:
  - section: "Features Added"
    description: "Added the 'azmcp resilience usageplan create' command to create or update a resilience usage plan in a resource group, including its plan type."
  - section: "Features Added"
    description: "Added the 'azmcp resilience usageplan enrollment create' command to create or update an enrollment under a resilience usage plan, associating it with a service group."
  - section: "Features Added"
    description: "Added the 'azmcp resilience drill get' command to list or retrieve drill details for a service group."
  - section: "Features Added"
    description: "Added the 'azmcp resilience drill resource get' command to list or retrieve resources associated with a drill."
