changes:
  - section: "Features Added"
    description: "Expanded `advisor recommendation summary` with lifecycle status, metadata subcategory, service-retirement date, and recommendation type groupings and filters."
  - section: "Breaking Changes"
    description: "Changed `advisor recommendation summary --group-by recommendation-type` so `groups[].key` is the stable recommendation type ID GUID instead of recommendation problem text. Use `groups[].label` for the friendly display name; callers that relied on problem-text keys must migrate."
  - section: "Bugs Fixed"
    description: "Corrected impacted resource type summary keys, added metadata-authoritative category and impact values, rejected invalid summary filters and top limits, excluded legacy 32-character Advisor recommendation IDs to prevent old/new engine duplicates, and reserved nonempty `serviceGroupId` recommendations for the future service-group flavor."
