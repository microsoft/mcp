changes:
  - section: "Features Added"
    description: "Added private-preview `monitor traces` commands to query distributed traces from Azure Monitor Workspaces enabled for Trace Store: `account list`, `field list`, `query run`, and `query cancel`. Workspace operations require `resource-group` and `workspace`, matching Log Analytics search targeting. Account listing reports truncated discovery results. Requests use cloud-specific endpoint validation, and query submission and resumption have separate service paths."
