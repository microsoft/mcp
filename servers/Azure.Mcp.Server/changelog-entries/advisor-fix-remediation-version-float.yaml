changes:
  - section: "Bugs Fixed"
    description: "Fixed a deserialization failure in the Advisor remediation tool (`advisor_remediation_get`) when the Advisor API returns a double `properties.version` value. The `version` field is now read as a number, resolving the 500 error."
  - section: "Other Changes"
    description: "Removed the obsolete `source` field from the Advisor remediation step model to match the Advisor API, which no longer returns it. The `sourceUrl` field is unchanged."
