changes:
  - section: "Bugs Fixed"
    description: "Honor the per-call tenant for `EnvironmentCredential` (service principal). `--tenant` and the `tenant` tool argument were silently ignored when authenticating with `AZURE_CLIENT_ID`/`AZURE_CLIENT_SECRET`, so requests for another consented tenant ran against `AZURE_TENANT_ID`."
  - section: "Bugs Fixed"
    description: "Honor a per-call `tenant` for tools proxied from registry servers (`arm_*`, `foundry_*`). These tools exposed no tenant argument and always ran against the tenant of the identity hosting the server, so a consented tenant could not be reached and a caller in front of the server could not scope a request to one."
