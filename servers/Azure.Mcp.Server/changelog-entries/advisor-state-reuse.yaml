changes:
  - section: "Bugs Fixed"
    description: "Validate Advisor historical ranges against the effective upper bound, preserve full UTC timestamp precision, and match App Service plans by resource type when service-family metadata and resource IDs are unavailable."
  - section: "Bugs Fixed"
    description: "Allow telemetry for the Advisor Cost IdleResources skill and its scenario references, including the shared Advisor workflow."
  - section: "Bugs Fixed"
    description: "Preserve published accumulated Cost for Completed Advisor recommendations without continuing cost accrual; retain unavailable pricing separately from known realized savings."
  - section: "Bugs Fixed"
    description: "Extend existing Advisor list and summary tools for multiple subscriptions or one explicitly supplied Service Group without exposing a separate scope-discovery tool. Preserve global ranking and counts, priority-first retail USD savings ordering, consistent lifecycle status filters, and existing scalar tool options."
  - section: "Bugs Fixed"
    description: "Restore complete Advisor retail USD Cost reports in the existing summary tool, including full-population and recommendation-type totals, lifecycle counts, pricing availability, and calculation-window metadata independent of displayed groups."
  - section: "Bugs Fixed"
    description: "Reuse existing prioritized summaries to rank Cost IdleResources recommendation types by potential savings for open lifecycle states and realized savings for Completed, with unavailable values last. Preserve normal summary record counts and frequency ordering."
  - section: "Bugs Fixed"
    description: "Calculate Cost IdleResources report totals in the existing normal and prioritized summary queries, reusing their filtered populations, savings formulas, and paging without a separate Cost query. Identify retail-derived report totals and prioritized Cost savings with the Retail pricing basis."
  - section: "Bugs Fixed"
    description: "Accept Service Group names, identifiers, and full ARM resource IDs in existing Advisor list, summary, and update tools, reusing the tenant-root Resource Graph scope query and display-name fallback. Derive canonical identifiers from ARM IDs and report ambiguous or incomplete matches without subscription fallback."
  - section: "Bugs Fixed"
    description: "Support product-family filtering before prioritized summary aggregation, exclude completed IdleResources records from potential savings, preserve literal Service Group names, and deduplicate subscription name/ID aliases. Default historical summaries to Completed, honor explicit states, and preserve current New defaults and all-state status grouping."
