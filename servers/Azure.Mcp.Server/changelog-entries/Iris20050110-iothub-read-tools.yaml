changes:
  - section: "Features Added"
    description: |
      Added Azure IoT Hub device and query read tools:
      - `iothub_device_show`: Show a device identity from an IoT Hub device registry
      - `iothub_device_stats`: Get device statistics for an IoT Hub identity registry
      - `iothub_device_twin_get`: Get a device twin from an IoT Hub device registry
      - `iothub_query_run`: Run an IoT Hub SQL-like query and return a single page of results
      - `iothub_query_compile`: Compile structured predicates into an IoT Hub query string
      - `iothub_query_discover`: Discover queryable IoT Hub device twin field paths
