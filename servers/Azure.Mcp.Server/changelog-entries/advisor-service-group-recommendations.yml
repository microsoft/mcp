changes:
  - section: Features Added
    description: Extended the Azure Advisor recommendation list tool to support the Azure Service Group scope (--service-group-id) as an independent alternative to the subscription scope, and added a --mode option (All or Contextual) that surfaces and ranks recommendations by contextual criticality score. Recommendation results now include contextual fields (criticality, criticalityScore, scoreChangedAt, savings) and the serviceGroupId identifier when present.
