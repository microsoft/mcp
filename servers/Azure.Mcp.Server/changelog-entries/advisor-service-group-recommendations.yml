changes:
  - section: Features Added
    description: Extended the Azure Advisor recommendation list tool to support Azure Service Group scope (--service-group) as an alternative to subscription scope. The --prioritized option sorts individual records in ARG by criticalityScore with missing scores treated as zero, or by potential savings with missing values last when --category Cost is explicitly selected. Recommendation results now include contextual fields (criticality, criticalityScore, scoreChangedAt, savings) and the serviceGroupId identifier when present.
