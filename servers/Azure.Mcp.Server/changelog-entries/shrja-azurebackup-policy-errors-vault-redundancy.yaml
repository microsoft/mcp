changes:
  - section: "Bugs Fixed"
    description: "Fixed `azurebackup vault create --storage-type` and `azurebackup vault update --redundancy` for Recovery Services vaults to set storage redundancy through the vault API (`properties.redundancySettings`) instead of the legacy backup storage configuration API, which Azure rejects with `BMSUserErrorRedundancySettingsUseVaultApi`. The applied value is verified by read-back, Cross-Region Restore is preserved, LocallyRedundant/ZoneRedundant are rejected while Cross-Region Restore is enabled, and `--redundancy` now accepts only GeoRedundant, LocallyRedundant, or ZoneRedundant. `vault create` returns the applied `storageRedundancy`."
  - section: "Bugs Fixed"
    description: "Fixed `azurebackup policy create` and `azurebackup policy update` sending Azure VM instant recovery and retention values that Azure rejects with the unactionable `UserErrorInvalidRequestParameter` (`NO_PARAM`) error. Instant recovery retention is now validated as 1-5 days for Standard policies (exactly 5 for Standard Weekly) and 1-30 days for Enhanced policies, never longer than daily retention, and VM daily retention as 7-9999 days. The `--instant-rp-retention-days` description for `policy create` previously listed the Standard and Enhanced limits reversed."
  - section: "Other Changes"
    description: "`azurebackup policy create`, `policy update`, `vault create`, and `vault update` now replace Azure's `UserErrorInvalidRequestParameter` messages with guidance that names the parameter when Azure provides it, lists the options that were supplied, and states the relevant limits."
