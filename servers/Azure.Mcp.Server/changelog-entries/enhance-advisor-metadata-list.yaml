changes:
  - section: Breaking Changes
    description: Renamed advisor_recommendation-type_list to advisor_metadata_list and moved recommendation-type discovery to the global Azure Resource Graph metadata catalog with richer localized details and filters for subcategory, Service Health tracking ID, and service-retirement date. Service-retirement filters are scoped to HighAvailability/ServiceUpgradeAndRetirement metadata, and conflicting category or subcategory filters are rejected.
