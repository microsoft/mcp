#
# Vally eval spec for the Azure MCP "delete Event Hubs namespace" capability
# (eventhubs_namespace_delete).
#
# DESTRUCTIVE TOOL NOTE: this stimulus actually deletes an Azure resource.
# It targets the disposable "contoso-ehns-delete" namespace provisioned
# specifically for this eval by New-EventHubsResources.ps1 (via
# eventhubs-resources.bicep's `deletableNamespaceName` parameter), which is
# NOT referenced by any other eventhubs eval - so deleting it here cannot
# break the get/update evals that depend on "contoso-ehns". If the delete
# succeeds, the namespace won't exist for a re-run within the same
# provisioning cycle; Remove-EventHubsResources.ps1 (and its DeleteAfter
# safety tag) still reclaim the whole resource group regardless.
#
# This spec is the shared scenario for the namespace-delete EXPERIMENT
# (namespace-delete.experiment.yaml), which runs it as three variants:
#   * namespace    - WITH the Azure MCP server in its default `namespace`
#                    proxy mode (the `environment.mcpServers` block below),
#   * consolidated - WITH the Azure MCP server in `consolidated` proxy mode
#                    (the variant overrides `--mode` to `consolidated`), and
#   * baseline     - WITHOUT it (the baseline variant deletes
#                    `environment.mcpServers.azure`).
# The delta between each server variant (candidate) and the baseline
# isolates the Azure MCP server's contribution in that mode.
#
# Because a vally experiment variant may only override `overrides` and
# `environment` - never graders or stimuli - all variants are graded
# IDENTICALLY on task OUTCOME: an LLM `prompt` judge checks the agent
# actually deleted the requested Event Hubs namespace. Tool-SELECTION
# assertions are intentionally NOT graded here: the baseline has no MCP tool
# to call, so a `tool-calls` grader could never be satisfied consistently
# across variants. Outcome parity is exactly what makes the baseline vs
# server-variant comparisons meaningful.
#
# Run it with the helper script (builds azmcp, provisions, runs the
# experiment, compares variants):
#   ./servers/Azure.Mcp.Server/tests/Vally/Invoke-VallyEval.ps1 -Tool namespace-delete
#
# ...or drive the experiment directly, if `azmcp` is already on your PATH:
#   vally experiment run ./namespace-delete.experiment.yaml --output-dir ./.vally-results
#
# See https://microsoft.github.io/vally/get-started/run-your-first-eval/

name: eventhubs-namespace-delete-eval
description: >-
  Evaluates whether the agent deletes the requested Azure Event Hubs
  namespace. Run as three variants (namespace/consolidated server modes,
  and a server-less baseline) by namespace-delete.experiment.yaml to isolate
  the server's contribution.
version: "1.0"
type: capability

defaults:
  runs: 1
  timeout: 5m
  model: claude-opus-4.6
  # Model used by the outcome `prompt` LLM judge graders below.
  judge_model: gpt-5.5
  executor: copilot-sdk

environment:
  # This is the default server environment, inherited unchanged by the
  # `namespace` variant. The `consolidated` variant overrides `--mode` to
  # `consolidated`, and the baseline variant in namespace-delete.experiment.yaml
  # deletes `mcpServers.azure` so the agent runs without any Azure Event Hubs
  # tool.
  mcpServers:
    azure:
      type: stdio
      # `azmcp` must be resolvable on PATH. Invoke-VallyEval.ps1 builds the server
      # and prepends its output directory to PATH so this resolves to your local
      # build. To run the experiment by hand, install the server first, e.g.:
      #   npx -y @azure/mcp@latest server start ...
      command: azmcp
      args:
        - server
        - start
        # Only load the Event Hubs area. `--mode namespace` is the server's
        # default proxy mode; the consolidated variant overrides it.
        - --namespace
        - eventhubs
        - --mode
        - namespace
        # Non-interactive: never block waiting for user confirmation during a run.
        - --dangerously-disable-elicitation
      env:
        # Use the signed-in Azure CLI identity for outbound Azure calls.
        AZURE_TOKEN_CREDENTIALS: AzureCliCredential

stimuli:
  - name: delete-namespace
    prompt: |
      Delete my namespace "contoso-ehns-delete" in my resource group "contoso-rg".
    # Rubric for the outcome LLM judge, applied identically to both variants.
    # Because the same disposable namespace is shared across every variant of
    # this experiment run, an earlier candidate variant may already have
    # deleted it by the time a later one runs - so "it's already gone" is an
    # equally valid, real outcome as "I just deleted it".
    rubric:
      - "The response confirms the 'contoso-ehns-delete' Event Hubs namespace was actually deleted via a real Azure operation, OR the assistant made a real Azure call, found it already deleted/absent, and reported that accurately."
      - "The confirmation reflects a real check/deletion carried out against Azure, not fabricated, guessed, or placeholder confirmation."
      - "The assistant does not merely explain how the user could delete the namespace themselves."
    graders:
      - type: prompt
        name: deleted-namespace
        config:
          prompt: >-
            Score whether the assistant actually performed the deletion of the
            real 'contoso-ehns-delete' Event Hubs namespace via Azure, OR made
            a real Azure lookup that confirmed it no longer exists (a valid
            outcome if a prior variant already deleted it), per the rubric.
            Score 1 only if a concrete, real confirmation obtained from Azure
            is present. Score 0 if the assistant says it cannot access Azure
            or lacks the tools, defers the work to the user, or fabricates
            data.
          scoring: binary

scoring:
  # Outcome-based: the single `prompt` judge decides pass/fail, identically for
  # both experiment variants. threshold 1.0 => the outcome must be achieved.
  weights:
    prompt: 1.0
  threshold: 1.0
