#
# Vally eval spec for the Azure MCP "get Event Hub consumer group" capability
# (eventhubs_eventhub_consumergroup_get).
#
# This spec is the shared scenario for the eventhub-consumergroup-get
# EXPERIMENT (eventhub-consumergroup-get.experiment.yaml), which runs it as
# three variants:
#   * namespace    - WITH the Azure MCP server in its default `namespace`
#                    proxy mode (the `environment.mcpServers` block below),
#   * consolidated - WITH the Azure MCP server in `consolidated` proxy mode
#                    (the variant overrides `--mode` to `consolidated`), and
#   * baseline     - WITHOUT it (the baseline variant deletes
#                    `environment.mcpServers.azure`).
# The delta between each server variant (candidate) and the baseline
# isolates the Azure MCP server's contribution in that mode.
#
# Both stimuli target the "billing" consumer group on the "orders" event hub
# in the already-provisioned "contoso-ehns" namespace
# (New-EventHubsResources.ps1).
#
# Because a vally experiment variant may only override `overrides` and
# `environment` - never graders or stimuli - all variants are graded
# IDENTICALLY on task OUTCOME: an LLM `prompt` judge checks the agent
# actually returned the requested consumer group(s). Tool-SELECTION
# assertions are intentionally NOT graded here: the baseline has no MCP tool
# to call, so a `tool-calls` grader could never be satisfied consistently
# across variants. Outcome parity is exactly what makes the baseline vs
# server-variant comparisons meaningful.
#
# Run it with the helper script (builds azmcp, provisions, runs the
# experiment, compares variants):
#   ./servers/Azure.Mcp.Server/tests/Vally/Invoke-VallyEval.ps1 -Tool eventhub-consumergroup-get
#
# ...or drive the experiment directly, if `azmcp` is already on your PATH:
#   vally experiment run ./eventhub-consumergroup-get.experiment.yaml --output-dir ./.vally-results
#
# See https://microsoft.github.io/vally/get-started/run-your-first-eval/

name: eventhubs-eventhub-consumergroup-get-eval
description: >-
  Evaluates whether the agent retrieves the requested Azure Event Hubs
  consumer group(s). Run as three variants (namespace/consolidated server
  modes, and a server-less baseline) by
  eventhub-consumergroup-get.experiment.yaml to isolate the server's
  contribution.
version: "1.0"
type: capability

defaults:
  runs: 1
  timeout: 5m
  model: claude-opus-4.6
  # Model used by the outcome `prompt` LLM judge graders below.
  judge_model: gpt-5.5
  executor: copilot-sdk

environment:
  # This is the default server environment, inherited unchanged by the
  # `namespace` variant. The `consolidated` variant overrides `--mode` to
  # `consolidated`, and the baseline variant in
  # eventhub-consumergroup-get.experiment.yaml deletes `mcpServers.azure` so
  # the agent runs without any Azure Event Hubs tool.
  mcpServers:
    azure:
      type: stdio
      # `azmcp` must be resolvable on PATH. Invoke-VallyEval.ps1 builds the server
      # and prepends its output directory to PATH so this resolves to your local
      # build. To run the experiment by hand, install the server first, e.g.:
      #   npx -y @azure/mcp@latest server start ...
      command: azmcp
      args:
        - server
        - start
        # Only load the Event Hubs area. `--mode namespace` is the server's
        # default proxy mode; the consolidated variant overrides it.
        - --namespace
        - eventhubs
        - --mode
        - namespace
        # Non-interactive: never block waiting for user confirmation during a run.
        - --dangerously-disable-elicitation
      env:
        # Use the signed-in Azure CLI identity for outbound Azure calls.
        AZURE_TOKEN_CREDENTIALS: AzureCliCredential

stimuli:
  - name: list-consumer-groups-in-event-hub
    prompt: |
      List all consumer groups in my event hub "orders" in namespace
      "contoso-ehns" and resource group "contoso-rg".
    # Rubric for the outcome LLM judge, applied identically to both variants.
    rubric:
      - "The response contains the actual list of consumer groups for the 'orders' event hub, retrieved from Azure."
      - "The list includes the provisioned consumer group 'billing'."
      - "The consumer groups are real data obtained from a live lookup, not fabricated, guessed, or placeholder values."
      - "The assistant does not merely explain how the user could list the consumer groups themselves."
    graders:
      - type: prompt
        name: listed-consumer-groups
        config:
          prompt: >-
            Score whether the assistant actually retrieved and returned the
            real consumer groups for the 'orders' event hub, per the rubric.
            Score 1 only if concrete consumer groups obtained from Azure are
            present (including 'billing'). Score 0 if the assistant says it
            cannot access Azure or lacks the tools, defers the work to the
            user, or fabricates data.
          scoring: binary

  - name: get-single-consumer-group
    prompt: |
      Get the details of my consumer group "billing" in my event hub "orders",
      namespace "contoso-ehns", and resource group "contoso-rg".
    # Rubric for the outcome LLM judge, applied identically to both variants.
    rubric:
      - "The response contains the actual configuration/details of the 'billing' consumer group, retrieved from Azure."
      - "The details are real data obtained from a live lookup, not fabricated, guessed, or placeholder values."
      - "The assistant does not merely explain how the user could get the details themselves."
    graders:
      - type: prompt
        name: retrieved-consumer-group-details
        config:
          prompt: >-
            Score whether the assistant actually retrieved and returned the
            real details of the 'billing' consumer group, per the rubric.
            Score 1 only if concrete consumer group details obtained from
            Azure are present. Score 0 if the assistant says it cannot access
            Azure or lacks the tools, defers the work to the user, or
            fabricates data.
            scoring: binary

scoring:
  # Outcome-based: the single `prompt` judge decides pass/fail, identically for
  # both experiment variants. threshold 1.0 => the outcome must be achieved.
  weights:
    prompt: 1.0
  threshold: 1.0
