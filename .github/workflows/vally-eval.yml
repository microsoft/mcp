name: Vally evaluations

on:
  pull_request:
    branches:
      - main
    types:
      - closed
    paths:
      - 'tools/Azure.Mcp.*/**/*.cs'
      - 'tools/Azure.Mcp.*/**/eval.yml'
      - 'tools/Azure.Mcp.*/**/eval.yaml'
  workflow_dispatch:
    inputs:
      serverName:
        description: 'Server name to run all evaluation tests for'
        required: true
        default: 'Azure.Mcp.Server'
        type: string
      logLevel:
        description: 'Is verbose'
        required: false
        default: false
        type: boolean

permissions:
  copilot-requests: write
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval-job:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    env:
      BUILD_INFO_PATH: ${{ github.workspace }}/.work/build_info.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0

      - name: Install Copilot CLI
        run: npm install -g @github/copilot@1.0.83

      - run: npm install -g @microsoft/vally-cli@0.15.0

      - name: Resolve git SHAs
        id: diff
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          SERVER_NAME: ${{ inputs.serverName }}
        run: |
          if ($env:EVENT_NAME -eq 'pull_request') {
            $baseCommit = $env:PR_BASE_SHA
            $headCommit = $env:PR_MERGE_SHA

            Write-Host "Pull request merged into main. Base: ${env:PR_BASE_SHA}, Merge: ${env:PR_MERGE_SHA}"
          }
          else {
            $headCommit = 'HEAD'
            $baseCommit = 'HEAD^'

            Write-Host "Manual run. Base: ${baseCommit}, Head: ${headCommit}"
          }

          $buildReason = 'PullRequest'

          "BUILD_REASON='$buildReason'" >> $env:GITHUB_ENV
          "DIFF_HEAD_COMMIT=$headCommit" >> $env:GITHUB_ENV
          "DIFF_BASE_COMMIT=$baseCommit" >> $env:GITHUB_ENV

      - name: Verify server exists
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: pwsh
        env:
          SERVER_NAME: ${{ inputs.serverName }}
        run: |
          $serversPath = Join-Path $env:GITHUB_WORKSPACE 'servers'
          $serverPath = Join-Path $serversPath $env:SERVER_NAME
          if (-not (Test-Path -LiteralPath $serverPath -PathType Container)) {
            $availableServers = Get-ChildItem -LiteralPath $serversPath -Directory |
              Sort-Object Name |
              ForEach-Object Name
            $availableServerList = $availableServers -join ', '

            throw "Server '$env:SERVER_NAME' does not exist. Available servers: $availableServerList."
          }

      - name: Create build_info.json
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          SERVER_NAME: ${{ inputs.serverName }}
        run: |
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            Write-Host "Running all evals for $env:SERVER_NAME"

            ./eng/scripts/New-BuildInfo.ps1 -ServerName $env:SERVER_NAME
          }
          else {
            Write-Host "Running evals based on changed files."
              
            if ($env:BUILD_REASON -eq 'PullRequest') {
              Write-Host "Run type: Pull request merged into main."
            }
            else {
              Write-Error "Should not hit this path because the run type is unexpected: $env:BUILD_REASON."
            }

            ./eng/scripts/New-BuildInfo.ps1 `
              -CommonCodeBuildsAll $false `
              -SourceCommittish $env:DIFF_HEAD_COMMIT `
              -TargetCommittish $env:DIFF_BASE_COMMIT
          }
      - name: Build server code
        shell: pwsh
        run: |
          $rid = [System.Runtime.InteropServices.RuntimeInformation]::RuntimeIdentifier
          $parts = $rid.Split('-')
          $dotnetOs = $parts[0]
          $arch = $parts[1]

          $platformOs = switch -Regex ($dotnetOs) {
            '^linux$' { 'linux' }
            '^osx$' { 'macos' }
            '^win' { 'windows' }
            default { throw "Unsupported runtime OS '$dotnetOs' from RID '$rid'" }
          }

          $platformName = "$platformOs-$arch"
          Write-Host "Current RID: $rid"
          Write-Host "Using build platform: $platformName"

          ./eng/scripts/Build-Code.ps1 -BuildInfoPath "$env:BUILD_INFO_PATH" -PlatformName $platformName -ReleaseBuild

      - name: Create vally evaluations
        run: dotnet run --project '${{ github.workspace }}/eng/tools/VallyEvaluator/src/VallyEvaluator.csproj' -- --buildInfo '${{ env.BUILD_INFO_PATH }}' --serverName ${{ inputs.serverName }}

      - name: Run vally
        id: vally
        run: |
          $isDebug = '${{ github.event.inputs.logLevel }}' -eq 'true'
          $buildInfo = "$env:BUILD_INFO_PATH"

          $baseVallyDirectory = '${{ github.workspace }}/.work/vally'
          $evalsDirectory = "$baseVallyDirectory/evals"
          $outputPath = "$baseVallyDirectory/vally-results"

          $workingDirectory = "${{ github.workspace }}"

          ./eng/scripts/Invoke-VallyEvalTests.ps1 -BuildInfoPath $buildInfo -WorkDirectory $workingDirectory -EvalsDirectory $evalsDirectory -OutputPath $outputPath -IsDebug:$isDebug -ServerName ${{ inputs.serverName }}
        shell: pwsh
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

      - name: Upload vally results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results-${{ github.run_id }}
          path: |
            ${{ github.workspace }}/.work/vally/vally-results
            ${{ env.BUILD_INFO_PATH }}
          if-no-files-found: warn
