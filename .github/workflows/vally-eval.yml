name: Vally evaluations

on:
  pull_request:
    branches:
      - main
    types:
      - closed
    paths:
      - 'tools/Azure.Mcp.*/**/*.cs'
      - 'tools/Azure.Mcp.*/**/eval.yml'
      - 'tools/Azure.Mcp.*/**/eval.yaml'
  workflow_dispatch:
    inputs:
      baseCommit:
        description: 'Base commit; defaults to HEAD^ on main branch'
        required: false
        default: 'HEAD^'
        type: string
      headCommit:
        description: 'Head commit; defaults to HEAD on main branch'
        required: false
        default: 'HEAD'
        type: string
      logLevel:
        description: 'Is verbose'
        required: false
        default: false
        type: boolean
      numberOfRuns:
        description: '# of runs per stimulus'
        required: false
        default: 1
        type: number

permissions:
  copilot-requests: write
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval-job:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    env:
      BUILD_INFO_PATH: ${{ github.workspace }}/.work/build_info.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0

      - run: npm install -g @microsoft/vally-cli@0.13.0

      - name: Resolve git SHAs
        id: diff
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_BASE: ${{ inputs.baseCommit }}
          MANUAL_HEAD: ${{ inputs.headCommit }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ($env:EVENT_NAME -eq 'pull_request') {
            $baseCommit = $env:PR_BASE_SHA
            $headCommit = $env:PR_HEAD_SHA

            Write-Host "Pull request merged into main. Base: $($env:PR_BASE_SHA), Head: $($env:PR_HEAD_SHA)"
          }
          else {
            $headCommit = if ($env:MANUAL_HEAD) { $env:MANUAL_HEAD } else { 'HEAD' }
            $baseCommit = if ($env:MANUAL_BASE) { $env:MANUAL_BASE } else { 'HEAD^' }

            Write-Host "Manual run. Base: $baseCommit, Head: $headCommit"
          }

          {
            echo "BUILD_REASON=PullRequest"
            echo "DIFF_HEAD_COMMIT=$headCommit"
            echo "DIFF_BASE_COMMIT=$baseCommit"
          } >> $env:GITHUB_ENV

      - name: Create build_info.json
        shell: pwsh
        run: |
          if ($env:BUILD_REASON -eq 'PullRequest') {
            Write-Host "Run type: PR run."
          }
          else {
            Write-Host "Run type: manual run"
          }

          ./eng/scripts/New-BuildInfo.ps1 `
            -ServerName Azure.Mcp.Server `
            -CommonCodeBuildsAll $false `
            -SourceCommittish $env:DIFF_HEAD_COMMIT `
            -TargetCommittish $env:DIFF_BASE_COMMIT

      - name: Build server code
        shell: pwsh
        run: |
          $rid = [System.Runtime.InteropServices.RuntimeInformation]::RuntimeIdentifier
          $parts = $rid.Split('-')
          $dotnetOs = $parts[0]
          $arch = $parts[1]

          $platformOs = switch -Regex ($dotnetOs) {
            '^linux$' { 'linux' }
            '^osx$' { 'macos' }
            '^win' { 'windows' }
            default { throw "Unsupported runtime OS '$dotnetOs' from RID '$rid'" }
          }

          $platformName = "$platformOs-$arch"
          Write-Host "Current RID: $rid"
          Write-Host "Using build platform: $platformName"

          ./eng/scripts/Build-Code.ps1 -BuildInfoPath "$env:BUILD_INFO_PATH" -PlatformName $platformName -ReleaseBuild

      - name: Create vally evaluations
        run: dotnet run --project '${{ github.workspace }}/eng/tools/VallyEvaluator/src/VallyEvaluator.csproj' -- --buildInfo "$env:BUILD_INFO_PATH" --serverName Azure.Mcp.Server

      - name: Run vally
        run: |
          $isDebug = '${{ github.event.inputs.logLevel }}' -eq 'true'
          $numberOfRuns = [int]'${{ inputs.numberOfRuns || 1 }}'
          $buildInfo = "$env:BUILD_INFO_PATH"

          $baseVallyDirectory = '${{ github.workspace }}/.work/vally'
          $evalsDirectory = "$baseVallyDirectory/evals"
          $outputPath = "$baseVallyDirectory/vally-results"

          $workingDirectory = "${{ github.workspace }}"

          ./eng/scripts/Invoke-VallyEvalTests.ps1 -BuildInfoPath $buildInfo -WorkDirectory $workingDirectory -EvalsDirectory $evalsDirectory -OutputPath $outputPath -NumberOfRuns $numberOfRuns -IsDebug:$isDebug
        shell: pwsh
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

      - name: Upload vally results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vally-results
          path: ${{ github.workspace }}/.work/vally/vally-results
          if-no-files-found: warn
