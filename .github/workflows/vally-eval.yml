name: Vally evaluations

on:
  pull_request:
    paths:
      - 'tools/Azure.Mcp.*/**'
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Is Debug'
        required: false
        default: false
        type: boolean
      numberOfRuns:
        description: 'Number of runs'
        required: false
        default: 1
        type: number

permissions:
  copilot-requests: write
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5.4.0

      - run: npm install -g @microsoft/vally-cli

      - name: Set BUILD_REASON environment variable
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          {
            echo "BUILD_REASON=PullRequest"
            echo "SYSTEM_PULLREQUEST_TARGETBRANCH=${{ github.base_ref }}"
            echo "SYSTEM_PULLREQUEST_SOURCECOMMITID=${{ github.event.pull_request.head.sha }}"
          } >> "$GITHUB_ENV"

      - name: Create build_info.json
        shell: pwsh
        run: |
          if ($env:BUILD_REASON -eq 'PullRequest') {
            Write-Host "Run type: PR run."
          }
          else {
            Write-Host "Run type: manual run"
          }

          ./eng/scripts/New-BuildInfo.ps1 -ServerName Azure.Mcp.Server

      - name: Build server code
        shell: pwsh
        run: |
          $rid = [System.Runtime.InteropServices.RuntimeInformation]::RuntimeIdentifier
          $parts = $rid.Split('-')
          $dotnetOs = $parts[0]
          $arch = $parts[1]

          $platformOs = switch -Regex ($dotnetOs) {
            '^linux$' { 'linux' }
            '^osx$' { 'macos' }
            '^win' { 'windows' }
            default { throw "Unsupported runtime OS '$dotnetOs' from RID '$rid'" }
          }

          $platformName = "$platformOs-$arch"
          Write-Host "Current RID: $rid"
          Write-Host "Using build platform: $platformName"

          ./eng/scripts/Build-Code.ps1 -BuildInfoPath "${{ github.workspace }}/.work/build_info.json" -PlatformName $platformName

      - name: Create vally evaluations
        run: dotnet run --project '${{ github.workspace }}/eng/tools/VallyEvaluator/src/VallyEvaluator.csproj' -- --buildInfo '${{ github.workspace }}/.work/build_info.json'

      - name: Run vally
        run: |
          $isDebug = '${{ github.event.inputs.logLevel }}' -eq 'true'
          $numberOfRuns = [int]'${{ inputs.numberOfRuns || 1 }}'
          $buildInfo = '${{ github.workspace }}/.work/build_info.json'

          $baseVallyDirectory = '${{ github.workspace }}/.work/vally'
          $evalsDirectory = "$baseVallyDirectory/evals"
          $outputPath = "$baseVallyDirectory/vally-results"

          $workingDirectory = "${{ github.workspace }}"
          
          Copy-Item ./eng/tools/VallyEvaluator/src/Resources/eval.instructions.md "$workingDirectory/AGENTS.md" -Force

          ./eng/scripts/Invoke-VallyEvalTests.ps1 -BuildInfoPath $buildInfo -WorkDirectory $workingDirectory -EvalsDirectory $evalsDirectory -OutputPath $outputPath -NumberOfRuns $numberOfRuns -IsDebug:$isDebug
        shell: pwsh
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

      - name: Upload vally results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: vally-results
          path: ${{ github.workspace }}/.work/vally/vally-results
          if-no-files-found: warn
