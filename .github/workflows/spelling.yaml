name: SpellCheck

on:
  pull_request:
    branches:
      - main
    types:
      # default
      - opened
      - synchronize
      - reopened
      # re-run if base branch is changed, since previous merge commit may
      # generate incorrect diff
      - edited

permissions:
  contents: read

jobs:
  spellcheck:
    name: SpellCheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: spellcheck-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2

      - name: Setup Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: eng/common/spelling/package-lock.json

      - name: Run spelling check
        run: |
          ./eng/common/scripts/check-spelling-in-changed-files.ps1 `
              -CSpellConfigPath './.vscode/cspell.json' `
              -SourceCommittish HEAD `
              -TargetCommittish HEAD^ `
              -SpellCheckRoot (Resolve-Path .) `
              -ExitWithError
          if ($LASTEXITCODE) {
            Write-Host "Spelling errors found in changed files. See https://aka.ms/ci-fix#spell-check"
            exit $LASTEXITCODE
          }
        shell: pwsh
