version: 2
updates:
  # Enable version updates for NuGet packages
  - package-ecosystem: "nuget"
    # Look for `.csproj` and `Directory.Packages.props` files in the root directory
    directory: "/"
    # Check the NuGet registry for updates every day (weekdays)
    schedule:
      interval: "daily"
    # Currently only enabling this for Azure.Bicep.Types package used by Azure MCP server
    # Feel free to extend this to other packages as needed
    allow:
      - dependency-name: "Azure.Bicep.Types"

  # Group npm security updates for the same dependency across the monorepo
  - package-ecosystem: "npm"
    directories:
      - "/servers/Azure.Mcp.Server/vscode"
      - "/servers/Fabric.Mcp.Server/vscode"
      - "/servers/Template.Mcp.Server/vscode"
      - "/eng/vsix-tools"
      - "/eng/common/tsp-client"
      - "/eng/common/spelling"
      - "/eng/common/scripts/eval"
    schedule:
      interval: "weekly"
    # Configure security updates without enabling routine npm version updates
    open-pull-requests-limit: 0
    groups:
      npm-security-updates:
        applies-to: "security-updates"
        group-by: "dependency-name"
