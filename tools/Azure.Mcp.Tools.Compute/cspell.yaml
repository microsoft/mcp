# Spell-check overrides for this toolset/server.
# Inherits the global config at the repo root.
#
# Add words that only appear in this folder here, in alphabetical order.
# Cross-cutting terms should go in the root cspell.yaml instead.
version: "0.2"
import:
  - ../../.vscode/cspell.json
words:
  - aaaab
  - aaaae
  - aaaai
  - datadisk
  - deldbl
  - delget
  - delvm
  - delvms
  - eaaaa
  - exactdisk
  - galleryimageversionid
  - lnxvmss
  - maaacbaj
  - mysnapshot
  - newestvm
  - nistp
  - noby
  - nonexistentdisk
  - nosize
  - oldestvm
  - osdisk
  - otherdisk
  - securedisk
  - swingbench
  - testdatadisk
  - testdisk
  - testkey
  - testvm
  - uploaddisk
  - uploadnosize
  - uploadsec
  - upsize
  - upsku
  - uptag
  - vmssipconfig
  - vmssnic
  - winvm
  - wxsbw
  - ymlu
