name: Azure Resiliency Agent evaluations
description: Tool-selection evaluations for Azure architecture and infrastructure-as-code resiliency
type: capability
stimuli:
  - name: Assess an application architecture
    prompt: Assess my App Service, PostgreSQL Flexible Server, and Redis architecture in East US 2 for availability-zone resiliency
    environment: ${ENVIRONMENT}
    tags:
    graders:
      - type: tool-calls
        config:
          required:
            - name: resiliencyagent
              command: resiliencyagent_architecture_assess
  - name: Generate new resilient infrastructure as code
    prompt: Generate zone-resilient Bicep for a new App Service API with PostgreSQL and Redis in East US 2
    environment: ${ENVIRONMENT}
    tags:
    graders:
      - type: tool-calls
        config:
          required:
            - name: resiliencyagent
              command: resiliencyagent_iac_generate
  - name: Review existing Bicep
    prompt: |
      Review this existing Bicep for availability-zone resiliency and preserve its resource name:
      resource plan 'Microsoft.Web/serverfarms@2024-11-01' = {
        name: 'contoso-plan'
        location: 'eastus2'
        sku: { name: 'P1v3' }
        properties: { zoneRedundant: false }
      }
    environment: ${ENVIRONMENT}
    tags:
    graders:
      - type: tool-calls
        config:
          required:
            - name: resiliencyagent
              command: resiliencyagent_bicep_review
  - name: Review existing ARM JSON
    prompt: |
      Review this existing ARM resource for availability-zone resiliency and preserve its name:
      {"type":"Microsoft.Web/serverfarms","apiVersion":"2024-11-01","name":"contoso-plan","location":"eastus2","sku":{"name":"P1v3"},"properties":{"zoneRedundant":false}}
    environment: ${ENVIRONMENT}
    tags:
    graders:
      - type: tool-calls
        config:
          required:
            - name: resiliencyagent
              command: resiliencyagent_arm_review
  - name: Review existing Terraform
    prompt: |
      Review this existing Terraform for availability-zone resiliency and preserve the resource address:
      resource "azurerm_service_plan" "api" {
        name                = "contoso-plan"
        location            = "East US 2"
        resource_group_name = "contoso-rg"
        os_type             = "Linux"
        sku_name            = "P1v3"
        zone_balancing_enabled = false
      }
    environment: ${ENVIRONMENT}
    tags:
    graders:
      - type: tool-calls
        config:
          required:
            - name: resiliencyagent
              command: resiliencyagent_terraform_review
