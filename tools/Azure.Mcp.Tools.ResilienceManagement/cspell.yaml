# Spell-check overrides for this toolset/server.
# Inherits the global config at the repo root.
#
# Add words that only appear in this folder here, in alphabetical order.
# Cross-cutting terms should go in the root cspell.yaml instead.
version: "0.2"
import:
  - ../../.vscode/cspell.json
words:
  - deletedrillname
  - drillname
  - drillresourcename
  - drillrunsourcelocation
  - enrollmentname
  - faultinjection
  - goalassignmentname
  - goaltemplatename
  - recoveryjobname
  - recoveryplanname
  - reinclusion
  - reprotect
  - reprotected
  - reprotection
  - reprotects
  - resiliencemanagement
  - servicegroupname
  - usageplanname
