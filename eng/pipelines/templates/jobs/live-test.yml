parameters:
- name: Matrix
  type: object
- name: MaxParallel
  type: number
- name: TimeoutInMinutes
  type: number

jobs:
- job: LiveTest
  displayName: "Live tests -"
  timeoutInMinutes: ${{ parameters.TimeoutInMinutes }}
  # The variable reference in the matrix parameter will resolve to a json map. If there are no live test legs, it will be an empty map.
  condition: and(succeeded(), ne(${{ parameters.Matrix }}, '{}'))
  strategy:
    maxParallel: ${{ parameters.MaxParallel }}
    matrix: $[ ${{ parameters.Matrix }} ]
  steps:
  - checkout: self

  - template: /eng/pipelines/templates/steps/install-dotnet.yml

  - task: UseNode@1
    displayName: 'Install Node.js 24'
    inputs:
      version: '24.x'

  - template: /eng/common/pipelines/templates/steps/create-authenticated-npmrc.yml

  - pwsh: |
      $serverName = $env:SERVERNAME

      if ([string]::IsNullOrWhiteSpace($serverName)) {
        ./eng/scripts/Build-Local.ps1 -VerifyNpx
      }
      else {
        ./eng/scripts/Build-Local.ps1 -ServerName $serverName -VerifyNpx
      }

      exit $LastExitCode
    displayName: "Build local package"
    workingDirectory: $(Build.SourcesDirectory)

  - pwsh: >
      ./eng/scripts/Test-Code.ps1
      -TestType 'Live'
      -Path $(PathToTest)
      -OnlyBuild
    displayName: "Confirm tests build"
    workingDirectory: $(Build.SourcesDirectory)

  - template: /eng/common/TestResources/build-test-resource-config.yml
    parameters:
      EnvVars:
        Pool: $(Pool)

  - template: /eng/common/TestResources/deploy-test-resources.yml
    parameters:
      ServiceConnection: azure-sdk-tests-public
      PersistOidcToken: true
      TestResourcesDirectory: $(Build.SourcesDirectory)/$(TestResourcesPath)

  - task: AzurePowershell@5
    displayName: "Run tests (stdio) - az pwsh"
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      AZURE_MCP_COLLECT_TELEMETRY: 'false'
    inputs:
      azureSubscription: azure-sdk-tests-public
      azurePowerShellVersion: 'LatestVersion'
      scriptType: InlineScript
      Inline: |
        ./eng/scripts/Test-Code.ps1 `
          -TestType 'Live' `
          -Path $(PathToTest) `
          -TestResultsPath '$(Build.ArtifactStagingDirectory)/testResults'

        exit $LastExitCode
      pwsh: true
      workingDirectory: $(Build.SourcesDirectory)

  # Some services (e.g. Azure Backup) have resources with dependency chains that
  # block resource group deletion. Toolsets can drop a 'remove-test-resources-pre.ps1'
  # script next to their test-resources.bicep to perform ordered cleanup before
  # Remove-TestResources.ps1 deletes the resource group.
  - task: AzurePowerShell@5
    displayName: "Pre-cleanup test resources (stdio)"
    condition: and(succeededOrFailed(), eq(variables['CI_HAS_DEPLOYED_RESOURCES'], 'true'), ne(variables['Skip.RemoveTestResources'], 'true'))
    continueOnError: true
    inputs:
      azureSubscription: azure-sdk-tests-public
      azurePowerShellVersion: LatestVersion
      pwsh: true
      scriptType: InlineScript
      Inline: |
        $preCleanupScript = Join-Path '$(Build.SourcesDirectory)' '$(TestResourcesPath)' 'remove-test-resources-pre.ps1'
        if (-not (Test-Path $preCleanupScript)) {
          Write-Host "No pre-cleanup script at '$preCleanupScript'. Skipping."
          exit 0
        }
        if ([string]::IsNullOrWhiteSpace($env:RESOURCE_GROUP)) {
          Write-Host "RESOURCE_GROUP environment variable is empty. Skipping pre-cleanup."
          exit 0
        }
        eng/common/scripts/Import-AzModules.ps1
        Write-Host "Invoking pre-cleanup script '$preCleanupScript' for resource group '$env:RESOURCE_GROUP'."
        & $preCleanupScript -ResourceGroupName $env:RESOURCE_GROUP
    workingDirectory: $(Build.SourcesDirectory)

  - template: /eng/common/TestResources/remove-test-resources.yml
    parameters:
      ServiceConnection: azure-sdk-tests-public

  - template: /eng/common/TestResources/deploy-test-resources.yml
    parameters:
      ServiceConnection: azure-sdk-tests-public
      PersistOidcToken: true
      TestResourcesDirectory: $(Build.SourcesDirectory)/$(TestResourcesPath)
      AdditionalParameters: "@{ UseHttpTransport = true }"
      SkipEnvironmentSetup: true # environment setup was performed in the first deployment

  - task: AzurePowershell@5
    displayName: "Run tests (http) - az pwsh"
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      AZURE_MCP_COLLECT_TELEMETRY: 'false'
    inputs:
      azureSubscription: azure-sdk-tests-public
      azurePowerShellVersion: 'LatestVersion'
      scriptType: InlineScript
      Inline: |
        ./eng/scripts/Test-Code.ps1 `
          -TestType 'Live' `
          -Path $(PathToTest) `
          -TestResultsPath '$(Build.ArtifactStagingDirectory)/testResults'

        exit $LastExitCode
      pwsh: true
      workingDirectory: $(Build.SourcesDirectory)

  - task: PublishTestResults@2
    condition: succeededOrFailed()
    displayName: "Publish Results"
    inputs:
      testResultsFiles: "$(Build.ArtifactStagingDirectory)/testResults/*.trx"
      testRunTitle: "live - $(PathToTest)"
      testResultsFormat: "VSTest"
      mergeTestResults: true

  - task: AzurePowerShell@5
    displayName: "Pre-cleanup test resources (http)"
    condition: and(succeededOrFailed(), eq(variables['CI_HAS_DEPLOYED_RESOURCES'], 'true'), ne(variables['Skip.RemoveTestResources'], 'true'))
    continueOnError: true
    inputs:
      azureSubscription: azure-sdk-tests-public
      azurePowerShellVersion: LatestVersion
      pwsh: true
      scriptType: InlineScript
      Inline: |
        $preCleanupScript = Join-Path '$(Build.SourcesDirectory)' '$(TestResourcesPath)' 'remove-test-resources-pre.ps1'
        if (-not (Test-Path $preCleanupScript)) {
          Write-Host "No pre-cleanup script at '$preCleanupScript'. Skipping."
          exit 0
        }
        if ([string]::IsNullOrWhiteSpace($env:RESOURCE_GROUP)) {
          Write-Host "RESOURCE_GROUP environment variable is empty. Skipping pre-cleanup."
          exit 0
        }
        eng/common/scripts/Import-AzModules.ps1
        Write-Host "Invoking pre-cleanup script '$preCleanupScript' for resource group '$env:RESOURCE_GROUP'."
        & $preCleanupScript -ResourceGroupName $env:RESOURCE_GROUP
    workingDirectory: $(Build.SourcesDirectory)

  - template: /eng/common/TestResources/remove-test-resources.yml
    parameters:
      ServiceConnection: azure-sdk-tests-public
