parameters:
- name: Matrix
  type: object
- name: MaxParallel
  type: number
- name: TimeoutInMinutes
  type: number

jobs:
- job: LiveTest
  displayName: "Live tests -"
  timeoutInMinutes: ${{ parameters.TimeoutInMinutes }}
  # The variable reference in the matrix parameter will resolve to a json map. If there are no live test legs, it will be an empty map.
  condition: and(succeeded(), ne(${{ parameters.Matrix }}, '{}'))
  strategy:
    maxParallel: ${{ parameters.MaxParallel }}
    matrix: $[ ${{ parameters.Matrix }} ]
  steps:
  - checkout: self

  - template: /eng/pipelines/templates/steps/install-dotnet.yml

  - task: UseNode@1
    displayName: 'Install Node.js 24'
    inputs:
      version: '24.x'

  - template: /eng/common/pipelines/templates/steps/create-authenticated-npmrc.yml

  - pwsh: |
      $serverName = $env:SERVERNAME

      if ([string]::IsNullOrWhiteSpace($serverName)) {
        ./eng/scripts/Build-Local.ps1 -VerifyNpx
      }
      else {
        ./eng/scripts/Build-Local.ps1 -ServerName $serverName -VerifyNpx
      }

      exit $LastExitCode
    displayName: "Build local package"
    workingDirectory: $(Build.SourcesDirectory)

  - pwsh: >
      ./eng/scripts/Test-Code.ps1
      -TestType 'Live'
      -Path $(PathToTest)
      -OnlyBuild
    displayName: "Confirm tests build"
    workingDirectory: $(Build.SourcesDirectory)

  - template: /eng/common/TestResources/build-test-resource-config.yml
    parameters:
      EnvVars:
        Pool: $(Pool)
      Condition: and(succeeded(), eq(variables['TestResourceProvider'], 'azure'))

  - template: /eng/common/TestResources/deploy-test-resources.yml
    parameters:
      ServiceConnection: azure-sdk-tests-public
      PersistOidcToken: true
      TestResourcesDirectory: $(Build.SourcesDirectory)/$(TestResourcesPath)
      Condition: and(succeeded(), eq(variables['TestResourceProvider'], 'azure'))

  - task: AzureCLI@2
    displayName: "Deploy test resources - custom"
    condition: and(succeeded(), eq(variables['TestResourceProvider'], 'custom'))
    inputs:
      azureSubscription: azure-sdk-tests-public
      scriptLocation: inlineScript
      scriptType: pscore
      inlineScript: |
        ./eng/common/TestResources/New-TestResources.ps1 `
          -TestResourcesDirectory '$(Build.SourcesDirectory)/$(TestResourcesPath)' `
          -CI `
          -Force | Out-Null

  - task: AzurePowershell@5
    displayName: "Run tests (stdio) - az pwsh"
    condition: and(succeeded(), eq(variables['TestResourceProvider'], 'azure'))
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      AZURE_TOKEN_CREDENTIALS: AzurePipelinesCredential
      AZURE_MCP_COLLECT_TELEMETRY: 'false'
    inputs:
      azureSubscription: azure-sdk-tests-public
      azurePowerShellVersion: 'LatestVersion'
      scriptType: InlineScript
      Inline: |
        ./eng/scripts/Test-Code.ps1 `
          -TestType 'Live' `
          -Path $(PathToTest) `
          -TestResultsPath '$(Build.ArtifactStagingDirectory)/testResults'

        exit $LastExitCode
      pwsh: true
      workingDirectory: $(Build.SourcesDirectory)

  - task: AzureCLI@2
    displayName: "Run tests (stdio) - custom"
    condition: and(succeeded(), eq(variables['TestResourceProvider'], 'custom'))
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      AZURE_MCP_COLLECT_TELEMETRY: 'false'
    inputs:
      azureSubscription: azure-sdk-tests-public
      scriptLocation: inlineScript
      scriptType: pscore
      inlineScript: |
        ./eng/scripts/Test-Code.ps1 `
          -TestType 'Live' `
          -Path $(PathToTest) `
          -TestResultsPath '$(Build.ArtifactStagingDirectory)/testResults'

        exit $LastExitCode
      workingDirectory: $(Build.SourcesDirectory)

  - template: /eng/common/TestResources/remove-test-resources.yml
    parameters:
      ServiceConnection: azure-sdk-tests-public
      Condition: and(succeededOrFailed(), eq(variables['TestResourceProvider'], 'azure'))

  - task: AzureCLI@2
    displayName: "Remove test resources - custom"
    condition: and(succeededOrFailed(), eq(variables['TestResourceProvider'], 'custom'), eq(variables['CI_HAS_DEPLOYED_RESOURCES'], 'true'), ne(variables['Skip.RemoveTestResources'], 'true'))
    continueOnError: true
    inputs:
      azureSubscription: azure-sdk-tests-public
      scriptLocation: inlineScript
      scriptType: pscore
      inlineScript: |
        ./eng/common/TestResources/Remove-TestResources.ps1 `
          -TestResourcesDirectory '$(Build.SourcesDirectory)/$(TestResourcesPath)' `
          -CI `
          -Force

  - template: /eng/common/TestResources/deploy-test-resources.yml
    parameters:
      ServiceConnection: azure-sdk-tests-public
      PersistOidcToken: true
      TestResourcesDirectory: $(Build.SourcesDirectory)/$(TestResourcesPath)
      SkipEnvironmentSetup: true # environment setup was performed in the first deployment
      Condition: and(succeeded(), eq(variables['TestResourceProvider'], 'azure'))

  - task: AzureCLI@2
    displayName: "Deploy test resources (http) - custom"
    condition: and(succeeded(), eq(variables['TestResourceProvider'], 'custom'))
    inputs:
      azureSubscription: azure-sdk-tests-public
      scriptLocation: inlineScript
      scriptType: pscore
      inlineScript: |
        ./eng/common/TestResources/New-TestResources.ps1 `
          -TestResourcesDirectory '$(Build.SourcesDirectory)/$(TestResourcesPath)' `
          -CI `
          -Force | Out-Null

  - task: AzurePowershell@5
    displayName: "Run tests (http) - az pwsh"
    condition: and(succeeded(), eq(variables['TestResourceProvider'], 'azure'))
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      AZURE_TOKEN_CREDENTIALS: AzurePipelinesCredential
      AZURE_MCP_COLLECT_TELEMETRY: 'false'
      MCP_TEST_TRANSPORT: 'http'
    inputs:
      azureSubscription: azure-sdk-tests-public
      azurePowerShellVersion: 'LatestVersion'
      scriptType: InlineScript
      Inline: |
        ./eng/scripts/Test-Code.ps1 `
          -TestType 'Live' `
          -Path $(PathToTest) `
          -TestResultsPath '$(Build.ArtifactStagingDirectory)/testResults'

        exit $LastExitCode
      pwsh: true
      workingDirectory: $(Build.SourcesDirectory)

  - task: AzureCLI@2
    displayName: "Run tests (http) - custom"
    condition: and(succeeded(), eq(variables['TestResourceProvider'], 'custom'))
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      AZURE_MCP_COLLECT_TELEMETRY: 'false'
      MCP_TEST_TRANSPORT: 'http'
    inputs:
      azureSubscription: azure-sdk-tests-public
      scriptLocation: inlineScript
      scriptType: pscore
      inlineScript: |
        ./eng/scripts/Test-Code.ps1 `
          -TestType 'Live' `
          -Path $(PathToTest) `
          -TestResultsPath '$(Build.ArtifactStagingDirectory)/testResults'

        exit $LastExitCode
      workingDirectory: $(Build.SourcesDirectory)

  - task: PublishTestResults@2
    condition: succeededOrFailed()
    displayName: "Publish Results"
    inputs:
      testResultsFiles: "$(Build.ArtifactStagingDirectory)/testResults/*.trx"
      testRunTitle: "live - $(PathToTest)"
      testResultsFormat: "VSTest"
      mergeTestResults: true

  - template: /eng/common/TestResources/remove-test-resources.yml
    parameters:
      ServiceConnection: azure-sdk-tests-public
      Condition: and(succeededOrFailed(), eq(variables['TestResourceProvider'], 'azure'))

  - task: AzureCLI@2
    displayName: "Remove test resources (http) - custom"
    condition: and(succeededOrFailed(), eq(variables['TestResourceProvider'], 'custom'), eq(variables['CI_HAS_DEPLOYED_RESOURCES'], 'true'), ne(variables['Skip.RemoveTestResources'], 'true'))
    continueOnError: true
    inputs:
      azureSubscription: azure-sdk-tests-public
      scriptLocation: inlineScript
      scriptType: pscore
      inlineScript: |
        ./eng/common/TestResources/Remove-TestResources.ps1 `
          -TestResourcesDirectory '$(Build.SourcesDirectory)/$(TestResourcesPath)' `
          -CI `
          -Force
