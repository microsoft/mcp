jobs:
# cspell:ignore SOURCECOMMITID TARGETBRANCH
- job: PackVSIXForPR
  displayName: "Pack VSIX"
  variables:
    # Matches the registryUrl default in
    # eng/common/pipelines/templates/steps/create-authenticated-npmrc.yml.
    # Public feed, so packaging reads it anonymously.
    VsixNpmRegistry: "https://pkgs.dev.azure.com/azure-sdk/public/_packaging/azure-sdk-for-js/npm/registry/"
  steps:
  - checkout: self
    fetchDepth: 0

  - pwsh: |
      $sourceCommit = $env:SYSTEM_PULLREQUEST_SOURCECOMMITID
      $targetBranch = "origin/$($env:SYSTEM_PULLREQUEST_TARGETBRANCH -replace '^refs/heads/', '')"
      $changedFiles = git diff --no-renames "$targetBranch...$sourceCommit" --name-only
      $hasVsixDependencyChanges = @($changedFiles | Where-Object {
        $_ -match '^servers/[^/]+/vscode/package(-lock)?\.json$'
      }).Count -gt 0
      Write-Host "##vso[task.setvariable variable=RunVsixPackaging]$($hasVsixDependencyChanges.ToString().ToLowerInvariant())"
    displayName: "Detect VSIX dependency changes"

  - download: current
    artifact: build_info
    displayName: "Download build_info"
    condition: and(succeeded(), eq(variables['RunVsixPackaging'], 'true'))

  - download: current
    displayName: "Download binaries"
    condition: and(succeeded(), eq(variables['RunVsixPackaging'], 'true'))

  - task: UseNode@1
    displayName: "Install Node.js 24"
    condition: and(succeeded(), eq(variables['RunVsixPackaging'], 'true'))
    inputs:
      version: "24.x"

  # Resolve npm packages from the azure-sdk feed rather than the public registry.
  #
  # Deliberately unauthenticated. This job installs and builds PR-controlled
  # content: `npm ci` runs dependency lifecycle scripts, and `vsce package` runs
  # the vscode:prepublish script (webpack) from the PR's own package.json. Writing
  # a feed credential into $HOME/.npmrc would hand that token to untrusted code,
  # so create-authenticated-npmrc.yml is intentionally not used here. The feed
  # serves anonymous reads, which is all packaging needs.
  - pwsh: |
      $npmrcPath = Join-Path $HOME '.npmrc'
      Write-Host "Creating unauthenticated .npmrc at $npmrcPath"
      'registry=$(VsixNpmRegistry)' | Out-File -FilePath $npmrcPath -Encoding ascii
    displayName: "Configure npm registry (no credentials)"
    condition: and(succeeded(), eq(variables['RunVsixPackaging'], 'true'))

  - task: Powershell@2
    displayName: "Prepare binaries for VSIX"
    condition: and(succeeded(), eq(variables['RunVsixPackaging'], 'true'))
    inputs:
      pwsh: true
      filePath: $(Build.SourcesDirectory)/eng/scripts/Compress-ForSigning.ps1
      arguments: >
        -BuildInfoPath '$(Pipeline.Workspace)/build_info/build_info.json'
        -ArtifactsPath '$(Pipeline.Workspace)'
        -ArtifactPrefix 'binaries_'
        -OutputPath '$(Pipeline.Workspace)/binaries'
        -PrepareForVsix

  - task: Powershell@2
    displayName: "Pack VSIX"
    condition: and(succeeded(), eq(variables['RunVsixPackaging'], 'true'))
    inputs:
      pwsh: true
      filePath: $(Build.SourcesDirectory)/eng/scripts/Pack-Vsix.ps1
      arguments: >
        -BuildInfoPath '$(Pipeline.Workspace)/build_info/build_info.json'
        -ArtifactsPath '$(Pipeline.Workspace)/binaries'
        -OutputPath '$(Build.ArtifactStagingDirectory)'
