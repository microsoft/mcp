parameters:
- name: DependsOn
  type: object
- name: PypiDevFeed
  type: string
  default: 'public/azure-sdk-for-python'

jobs:
- job: PackPyPI
  displayName: "Pack PyPI Package"
  dependsOn: ${{ parameters.DependsOn }}
  timeoutInMinutes: 120
  steps:
  - checkout: self

  - task: PipAuthenticate@1
    displayName: Authenticate to Dev feed for pip
    inputs:
      artifactFeeds: ${{ parameters.PypiDevFeed }}
      onlyAddExtraIndex: false

  - task: UsePythonVersion@0
    displayName: Use Python 3.12
    inputs:
      versionSpec: '3.12'

  - pwsh: |
      python -m unittest discover -s "$(Build.SourcesDirectory)/eng/pypi" -p test_azure_launcher.py
      if ($LASTEXITCODE -ne 0) { throw "Azure PyPI launcher tests failed." }
    displayName: Test Azure PyPI launcher

  - download: current
    displayName: Download build_info
    artifact: build_info

  - download: current
    displayName: Download binaries_signed
    artifact: binaries_signed

  - download: current
    displayName: Download signed release ZIPs for launcher integrity manifests
    artifact: binaries_signed_zipped

  - task: Powershell@2
    displayName: "Pack modules for PyPI"
    inputs:
      pwsh: true
      filePath: $(Build.SourcesDirectory)/eng/scripts/Pack-Pypi.ps1
      arguments: >
        -BuildInfoPath '$(Pipeline.Workspace)/build_info/build_info.json'
        -ArtifactsPath '$(Pipeline.Workspace)/binaries_signed'
        -ReleaseArtifactsPath '$(Pipeline.Workspace)/binaries_signed_zipped'
        -OutputPath '$(Build.ArtifactStagingDirectory)'

  - template: /eng/common/pipelines/templates/steps/publish-1es-artifact.yml
    parameters:
      ArtifactPath: $(Build.ArtifactStagingDirectory)
      ArtifactName: packages_pypi