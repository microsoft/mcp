pr:
  branches:
    include:
      - main
      - feature/*
      - hotfix/*
      - release/*
  paths:
    exclude:
      - '**/CHANGELOG.md'
      - '**/changelog-entries/**'
      - 'docs/changelog-entries.md'
      - 'docs/design/changelog-management-system.md'

trigger: none

extends:
  template: /eng/pipelines/templates/common.yml
  parameters:
    RunLiveTests: ${{ eq(variables['System.TeamProject'], 'internal') }}
